# Builds a signed iOS IPA on a macOS runner and uploads it to TestFlight.
# No local Mac needed: signing certificate + provisioning profile are created
# and fetched automatically via the App Store Connect API (codemagic-cli-tools).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect → Users & Access → Integrations
#   APP_STORE_CONNECT_KEY_IDENTIFIER  the API key's Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY     full contents of the downloaded .p8 file
#   CERTIFICATE_PRIVATE_KEY           an RSA 2048 private key (PEM) used to
#                                     create/reuse the iOS distribution cert
# Optional (same names the Android lanes use):
#   SUPABASE_URL / SUPABASE_ANON_KEY / REVENUECAT_IOS_KEY
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build iOS IPA + upload to TestFlight
    # macos-26 = Xcode 26 / iOS 26 SDK — required by cupertino_native_better's
    # Liquid Glass APIs (glassEffect etc.); macos-15's Xcode 16 can't compile it.
    runs-on: macos-26
    # Build ~25 min + up to 40 min waiting for Apple to process the upload
    # before the beta-group assignment (--max-build-processing-wait below).
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.mygymbro.myGymBro
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set — see the header of this workflow file"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed against. Latest stable
          # removed CupertinoPageTransitionsBuilder (used in lib/app.dart) —
          # bump this deliberately together with a local Flutter upgrade.
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Fetch signing files (creates cert + profile on first run)
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          # The Live Activity widget extension is its own bundle id and needs
          # its own App ID + provisioning profile (created via the API too).
          app-store-connect fetch-signing-files "$BUNDLE_ID.MyGymBroLiveActivity" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        run: |
          # BETA_FREE disables the paywall/trial gate for TestFlight testers.
          # Remove this define when this lane starts producing store builds.
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist "$HOME/export_options.plist" \
            --dart-define=BETA_FREE=true \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}

      - name: Upload to TestFlight
        # --testflight submits the build for beta app review and --beta-group
        # assigns it to the external tester group once Apple finishes
        # processing (assignment alone would not trigger review submission).
        # First review of a version takes up to a day; later builds of the
        # same version are approved near-instantly.
        run: |
          app-store-connect publish --path build/ios/ipa/*.ipa \
            --testflight \
            --beta-group "my gym bro testers1" \
            --max-build-processing-wait 40

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
