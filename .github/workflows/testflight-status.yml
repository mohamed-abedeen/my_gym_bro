# Read-only: reports where a TestFlight build stands on Apple's side —
# processing state, beta-review state and beta-group assignment — using the
# same App Store Connect API key the TestFlight lane uses. Nothing is
# modified. Runs on Linux: only the ASC REST calls are needed, no Xcode.
#
# Run it with:  gh workflow run testflight-status.yml [-f build_number=38]
# Read it with: gh run view <run-id> (the summary tab has the table).
name: TestFlight status

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to inspect (blank = latest uploaded build)"
        required: false
        default: ""

jobs:
  status:
    name: Beta review status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.mygymbro.myGymBro
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Look up the build
        id: build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          args=(--bundle-id "$BUNDLE_ID" --platform IOS --json)
          if [ -n "$BUILD_NUMBER" ]; then
            args+=(--build-version-number "$BUILD_NUMBER")
          fi
          app-store-connect builds list "${args[@]}" > builds.json
          count=$(jq 'length' builds.json)
          if [ "$count" -eq 0 ]; then
            echo "::error::no build found for bundle $BUNDLE_ID${BUILD_NUMBER:+ with build number $BUILD_NUMBER}"
            exit 1
          fi
          # Newest upload wins when several builds match.
          jq 'sort_by(.attributes.uploadedDate) | last' builds.json > build.json
          echo "id=$(jq -r '.id' build.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.attributes.version' build.json)" >> "$GITHUB_OUTPUT"
          echo "Recent builds (newest last):"
          jq -r '.[] | "  build \(.attributes.version)  \(.attributes.processingState)  uploaded \(.attributes.uploadedDate)"' builds.json | tail -n 5

      - name: Fetch beta details and review submission
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -uo pipefail
          # Each call is best-effort so one unsupported flag can't hide the rest.
          app-store-connect builds get "$BUILD_ID" --json > build_full.json \
            || { echo "::warning::builds get failed"; echo '{}' > build_full.json; }
          app-store-connect builds beta-detail "$BUILD_ID" --json > beta_detail.json \
            || { echo "::warning::builds beta-detail failed"; echo '{}' > beta_detail.json; }
          app-store-connect beta-app-review-submissions list --build-id "$BUILD_ID" --json > review.json \
            || { echo "::warning::beta-app-review-submissions list failed"; echo '[]' > review.json; }
          app-store-connect beta-groups list --bundle-id "$BUNDLE_ID" --json > groups.json \
            || { echo "::warning::beta-groups list failed"; echo '[]' > groups.json; }

      - name: Summary
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -uo pipefail
          processing=$(jq -r '.attributes.processingState // "?"' build.json)
          uploaded=$(jq -r '.attributes.uploadedDate // "?"' build.json)
          expired=$(jq -r '.attributes.expired // "?"' build.json)
          internal=$(jq -r '.attributes.internalBuildState // (.[0]? .attributes.internalBuildState) // "?"' beta_detail.json 2>/dev/null || echo "?")
          external=$(jq -r '.attributes.externalBuildState // (.[0]? .attributes.externalBuildState) // "?"' beta_detail.json 2>/dev/null || echo "?")
          review=$(jq -r 'if type=="array" then (.[0].attributes.betaReviewState // "none") else (.attributes.betaReviewState // "none") end' review.json 2>/dev/null || echo "?")
          groups=$(jq -r '[.[] | .attributes.name] | join(", ")' groups.json 2>/dev/null || echo "?")

          {
            echo "## TestFlight build $VERSION"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Build id | \`$BUILD_ID\` |"
            echo "| Uploaded | $uploaded |"
            echo "| Processing state | **$processing** |"
            echo "| Internal build state | **$internal** |"
            echo "| External build state | **$external** |"
            echo "| Beta review state | **$review** |"
            echo "| Expired | $expired |"
            echo "| Beta groups on the app | $groups |"
            echo
            echo "_External states: READY_FOR_BETA_SUBMISSION → WAITING_FOR_BETA_REVIEW → IN_BETA_REVIEW → IN_BETA_TESTING (approved) / BETA_REJECTED._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo
          echo "=== raw: build ==="; cat build.json
          echo "=== raw: beta detail ==="; cat beta_detail.json
          echo "=== raw: review submissions ==="; cat review.json
