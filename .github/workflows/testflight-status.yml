# Read-only: reports where a TestFlight build stands on Apple's side —
# processing state and beta-review state — using the same App Store Connect
# API key the TestFlight lane uses. Nothing is modified. Runs on Linux: only
# the ASC REST calls are needed, no Xcode.
#
# Run it with:  gh workflow run testflight-status.yml [-f build_number=38]
# Read it with: gh run view <run-id> (the summary tab has the table).
name: TestFlight status

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to inspect (blank = latest uploaded build)"
        required: false
        default: ""

jobs:
  status:
    name: Beta review status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.mygymbro.myGymBro
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Look up the build
        id: build
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # builds list filters by app id, not bundle id — resolve it first.
          app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json > apps.json
          app_id=$(jq -r '.[0].id // empty' apps.json)
          if [ -z "$app_id" ]; then
            echo "::error::no App Store Connect app found for bundle id $BUNDLE_ID"
            exit 1
          fi
          echo "app_id=$app_id"

          args=(--app-id "$app_id" --platform IOS --json)
          if [ -n "$BUILD_NUMBER" ]; then
            args+=(--build-version-number "$BUILD_NUMBER")
          fi
          app-store-connect builds list "${args[@]}" > builds.json
          if [ "$(jq 'length' builds.json)" -eq 0 ]; then
            echo "::error::no build found${BUILD_NUMBER:+ with build number $BUILD_NUMBER}"
            exit 1
          fi
          # Newest upload wins when several builds match.
          jq 'sort_by(.attributes.uploadedDate) | last' builds.json > build.json
          echo "id=$(jq -r '.id' build.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.attributes.version' build.json)" >> "$GITHUB_OUTPUT"
          echo "Recent builds (newest last):"
          jq -r '.[] | "  build \(.attributes.version)  \(.attributes.processingState)  uploaded \(.attributes.uploadedDate)"' builds.json | tail -n 5

      - name: Fetch beta review submission
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -uo pipefail
          # Best-effort: a build that was never submitted simply has none.
          app-store-connect beta-app-review-submissions list "$BUILD_ID" --json > review.json \
            || { echo "::warning::beta-app-review-submissions list failed"; echo '[]' > review.json; }

      - name: Summary
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -uo pipefail
          processing=$(jq -r '.attributes.processingState // "?"' build.json)
          uploaded=$(jq -r '.attributes.uploadedDate // "?"' build.json)
          expired=$(jq -r '.attributes.expired // "?"' build.json)
          min_os=$(jq -r '.attributes.minOsVersion // "?"' build.json)
          review=$(jq -r 'if type=="array" then (.[0].attributes.betaReviewState // "not submitted") else (.attributes.betaReviewState // "not submitted") end' review.json 2>/dev/null || echo "?")

          case "$review" in
            APPROVED) meaning="approved — external testers can install" ;;
            WAITING_FOR_REVIEW) meaning="queued for Apple's beta review" ;;
            IN_REVIEW) meaning="Apple is reviewing it now" ;;
            REJECTED) meaning="rejected — see App Store Connect for the reason" ;;
            *) meaning="internal testers only (no external submission found)" ;;
          esac

          {
            echo "## TestFlight build $VERSION"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Build id | \`$BUILD_ID\` |"
            echo "| Uploaded | $uploaded |"
            echo "| Processing state | **$processing** |"
            echo "| Beta review state | **$review** — $meaning |"
            echo "| Min OS | $min_os |"
            echo "| Expired | $expired |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo
          echo "=== raw: build ==="; cat build.json
          echo "=== raw: review submissions ==="; cat review.json
