# Builds the STORE-configured iOS IPA on a macOS runner and uploads it to App
# Store Connect: paywall ON (no BETA_FREE), RevenueCat key required, Firebase
# and the licensed exercise source when their secrets exist. It only uploads
# and waits for Apple to process the build — attaching it to the App Store
# version and pressing "Add for Review" stays a deliberate step in App Store
# Connect (metadata, screenshots and the first subscription review ride along
# with the version). Signing, runner and Flutter pins mirror testflight.yml.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_ISSUER_ID / _KEY_IDENTIFIER / _PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   REVENUECAT_IOS_KEY               public SDK key (appl_…) — store builds must gate
# Optional:
#   FIREBASE_IOS_PLIST_B64           base64 of GoogleService-Info.plist (Crashlytics/FCM)
#   EXERCISEDB_API_KEY  + repo variable EXERCISEDB_BASE_URL (licensed exercise data)
name: App Store build

on:
  workflow_dispatch:

# Shared with testflight.yml: both lanes derive the build number from App
# Store Connect (latest + 1), so they must never upload concurrently.
concurrency:
  group: ios-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build store IPA + upload to App Store Connect
    # macos-26 = Xcode 26 / iOS 26 SDK — required by cupertino_native_better.
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.mygymbro.myGymBro
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
          EXERCISEDB_BASE_URL: ${{ vars.EXERCISEDB_BASE_URL }}
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY \
                   SUPABASE_URL SUPABASE_ANON_KEY REVENUECAT_IOS_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set — a store build cannot ship without it (see the header of this workflow)"
              missing=1
            fi
          done
          [ -n "$FIREBASE_IOS_PLIST_B64" ] || echo "::warning::FIREBASE_IOS_PLIST_B64 not set — Crashlytics and push stay inert in this build"
          [ -n "$EXERCISEDB_BASE_URL" ] || echo "::warning::EXERCISEDB_BASE_URL not set — this build uses the NON-COMMERCIAL OSS exercise API (store-release blocker)"
          exit $missing

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned together with testflight.yml and ci.yml.
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Fetch signing files
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.MyGymBroLiveActivity" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Resolve build number from App Store Connect
        id: build_number
        uses: ./.github/actions/asc-build-number
        with:
          bundle_id: ${{ env.BUNDLE_ID }}

      - name: Firebase options from secret
        uses: ./.github/actions/firebase-defines
        with:
          plist_b64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}

      - name: Build store IPA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          EXERCISEDB_BASE_URL: ${{ vars.EXERCISEDB_BASE_URL }}
          EXERCISEDB_API_KEY: ${{ secrets.EXERCISEDB_API_KEY }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          FIREBASE=()
          if [ -s firebase_defines.txt ]; then readarray -t FIREBASE < firebase_defines.txt; fi
          # No BETA_FREE here: the paywall/trial gate is live in store builds.
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist "$HOME/export_options.plist" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define="REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY" \
            --dart-define="EXERCISEDB_BASE_URL=$EXERCISEDB_BASE_URL" \
            --dart-define="EXERCISEDB_API_KEY=$EXERCISEDB_API_KEY" \
            "${FIREBASE[@]}"

      - name: Upload to App Store Connect and wait for processing
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          app-store-connect publish --path build/ios/ipa/*.ipa \
            --max-build-processing-wait 40
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          {
            echo "## Store build $version ($BUILD_NUMBER) uploaded"
            echo
            echo "Processed by Apple. Next, in App Store Connect → App Store → **$version** → Build: pick **$BUILD_NUMBER**, complete the metadata, then **Add for Review**."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-store
          path: build/ios/ipa/*.ipa
